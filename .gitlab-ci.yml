include:
  - project: "gnome/citemplates"
    file: "flatpak/flatpak_ci_initiative.yml"
  - component: gitlab.gnome.org/GNOME/citemplates/basic-release-with-dist@master
    inputs:
      dist-job-name: "flatpak@x86_64"

.flatpak_vars:
  image: "quay.io/gnome_infrastructure/gnome-runtime-images:gnome-51"
  variables:
    FLATPAK_MODULE: "bazaar"
    MANIFEST_PATH: "build-aux/flatpak/io.github.kolunmi.Bazaar.json"
    APP_ID: "io.github.kolunmi.Bazaar"
    RUNTIME_REPO: "https://dl.flathub.org/repo/flathub.flatpakrepo"

flatpak@x86_64:
  extends:
    - '.flatpak@x86_64'
    - '.flatpak_vars'

flatpak@aarch64:
  extends:
    - '.flatpak@aarch64'
    - '.flatpak_vars'

nightly@x86_64:
  extends: ".publish_nightly"
  needs: ["flatpak@x86_64"]

nightly@aarch64:
  extends: ".publish_nightly"
  needs: ["flatpak@aarch64"]

translations:
  stage: test
  image: "alpine:latest"
  interruptible: true
  script:
    - apk add --no-cache gettext
    - xgettext --from-code=UTF-8 --keyword=_ --keyword=N_ --keyword=C_:1c,2 --keyword=NC_:1c,2 --files-from=po/POTFILES.in --output=/dev/null
    - for po in po/*.po; do msgfmt --check --output-file=/dev/null "$po"; done
