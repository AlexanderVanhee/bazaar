search-biases:
  # Brief regex review:
  #   `^` indicates the beginning of the string
  #   `$` indicates the end of the string
  #   `\b` indicates a word boundary
  #   `(?i)` means case insensitive

  - # stop words, see https://gist.github.com/sebleier/554280
    regex: \b(?i)(i|me|my|myself|we|our|ours|ourselves|you|your|yours|yourself|yourselves|he|him|his|himself|she|her|hers|herself|it|its|itself|they|them|their|theirs|themselves|what|which|who|whom|this|that|these|those|am|is|are|was|were|be|been|being|have|has|had|having|do|does|did|doing|a|an|the|and|but|if|or|because|as|until|while|of|at|by|for|with|about|against|between|into|through|during|before|after|above|below|to|from|up|down|in|out|on|off|over|under|again|further|then|once|here|there|when|where|why|how|all|any|both|each|few|more|most|other|some|such|no|nor|not|only|own|same|so|than|too|very|s|t|can|will|just|don|should|now)\b
    convert-to: ""

  - regex: ^(?i)browser$
    convert-to: web browser
    boost-appids:
      - app.zen_browser.zen
      - io.github.ungoogled_software.ungoogled_chromium
      - org.chromium.Chromium
      - org.gnome.Epiphany
      - org.kde.falkon
      - org.mozilla.firefox
      - org.torproject.torbrowser-launcher
    linear-boost:
      slope: 1.333
      y-intercept: 40.0

  - regex: \b(?i)vm\b
    convert-to: virtual machine
    boost-appids:
      - org.virt_manager.virt-manager
      - org.gnome.Boxes
    linear-boost:
      slope: 1.0
      y-intercept: 50.0

  - regex: \b(?i)ide\b
    convert-to: develop
    boost-appids:
      - com.visualstudio.code
      - com.vscodium.codium
      - dev.zed.Zed
      - org.gnome.Builder
      - org.kde.kdevelop
    linear-boost:
      slope: 1.0
      y-intercept: 10.0

  - regex: \b(?i)daw\b
    boost-appids:
      # these don't normally show, despite being DAWs
      - fm.reaper.Reaper
      - io.lmms.LMMS
    linear-boost:
      slope: 1.0
      y-intercept: 20.0

  - regex: (?i)\bimage\seditors?\b
    boost-appids:
      - org.gimp.GIMP
      - com.github.PintaProject.Pinta
      - org.kde.krita
    linear-boost:
      slope: 1.0
      y-intercept: 200.0

  - regex: \b(?i)photoshop\b
    boost-appids:
      - org.gimp.GIMP
    linear-boost:
      slope: 1.0
      y-intercept: 20.0

  - regex: \b(?i)illustrator\b
    boost-appids:
      - org.inkscape.Inkscape
    linear-boost:
      slope: 1.0
      y-intercept: 20.0

  - regex: \b(?i)dl\b
    convert-to: download

  - regex: \b(?i)yt\b
    convert-to: youtube

  - regex: \b(?i)vids?\b
    convert-to: video

  - regex: \b(?i)mc\b
    convert-to: minecraft
