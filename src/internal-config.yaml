  - regex: \b(?i)(myslef|mysef|mysellf)\b
    convert-to: myself
  - regex: \b(?i)(ourselvs|oursleves|ourselfs|ourslefs)\b
    convert-to: ourselves
  - regex: \b(?i)(yuo|yoiu|yoou|youu)\b
    convert-to: you
  - regex: \b(?i)(yuor|yoru|yourr|yur)\b
    convert-to: your
  - regex: \b(?i)(yuors|yourss|yors)\b
    convert-to: yours
