search-biases:
  # Brief regex review:
  #   `^` indicates the beginning of the string
  #   `$` indicates the end of the string
  #   `\b` indicates a word boundary
  #   `(?i)` means case insensitive

  #########################################
  # adjustments for more sensible results #
  #########################################

  - regex: ^(?i)browser$
    convert-to: web browser
    boost-appids:
      - org.chromium.Chromium
      - org.mozilla.firefox
      - org.gnome.Epiphany
      - org.kde.falkon
      - org.torproject.torbrowser-launcher
    linear-boost:
      slope: 1.333
      y-intercept: 40.0

  - regex: \b(?i)vm\b
    convert-to: virtual machine
    boost-appids:
      - org.virt_manager.virt-manager
      - org.gnome.Boxes
    linear-boost:
      slope: 1.0
      y-intercept: 50.0

  - regex: \b(?i)ide\b
    convert-to: develop
    boost-appids:
      - org.gnome.Builder
      - org.kde.kdevelop
    linear-boost:
      slope: 1.0
      y-intercept: 50.0

  - regex: \b(?i)daw\b
    boost-appids:
      # these don't normally show, despite being DAWs
      - fm.reaper.Reaper
      - io.lmms.LMMS
    linear-boost:
      slope: 1.0
      y-intercept: 20.0

  - regex: (?i)\bimage\seditors?\b
    boost-appids:
      - org.gimp.GIMP
      - com.github.PintaProject.Pinta
      - org.kde.krita
    linear-boost:
      slope: 1.0
      y-intercept: 200.0

  - regex: \b(?i)photoshop\b
    boost-appids:
      - org.gimp.GIMP
    linear-boost:
      slope: 1.0
      y-intercept: 20.0

  - regex: \b(?i)illustrator\b
    boost-appids:
      - org.inkscape.Inkscape
    linear-boost:
      slope: 1.0
      y-intercept: 20.0

  ################################
  # basic abbreviation expansion #
  ################################

  - regex: \b(?i)dl\b
    convert-to: download

  - regex: \b(?i)yt\b
    convert-to: youtube

  - regex: \b(?i)vids?\b
    convert-to: video

  - regex: \b(?i)mc\b
    convert-to: minecraft

  ###########################################################
  # stop words, see https://gist.github.com/sebleier/554280 #
